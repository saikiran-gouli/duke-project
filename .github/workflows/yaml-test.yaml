name: YAML Configuration POC
 
on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "Select configuration file"
        required: true
        type: choice
        options:
          - dev.yaml
 
jobs:
  read-configuration:
    runs-on: ubuntu-latest
 
    steps:
      # The GitHub runner needs a copy of the repository
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # Install PyYAML so Python can read YAML
      - name: Install PyYAML
        run: pip install pyyaml
 
      # Pass the selected filename to our Python script
      - name: Read selected YAML
        run: |
          python scripts/read_config.py "${{ inputs.config_file }}"
