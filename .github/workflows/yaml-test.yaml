name: YAML Configuration POC

env:
  CONFIG_FILE: configs/yaml-test.yaml

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string

      aws_region:
        description: "AWS region"
        required: true
        type: string

      application:
        description: "Application name"
        required: true
        type: string

      action:
        description: "Action to perform"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Display inputs
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "AWS Region: ${{ inputs.aws_region }}"
          echo "Application: ${{ inputs.application }}"
          echo "Action: ${{ inputs.action }}"

      - name: Test
        run: |
          echo "POC workflow successfully triggered"
